              // ---------- helpers ----------
              private fun bn(s: String) = s.map { if (it in '0'..'9') 'à§¦' + (it - '0') else it }.joinToString("")
              private fun num(n: Long) = bn(String.format(Locale.US, "%,d", n))
              private fun dur(ms: Long): String {
                  val h = ms / 3_600_000; val m = ms / 60_000 % 60
                  return if (h > 0) "${bn(h.toString())} à¦˜à¦£à§à¦Ÿà¦¾ ${bn(m.toString())} à¦®à¦¿à¦¨à¦¿à¦Ÿ" else "${bn(m.toString())} à¦®à¦¿à¦¨à¦¿à¦Ÿ"
