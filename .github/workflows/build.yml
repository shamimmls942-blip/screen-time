                  Act("ðŸš¶", 80.0) { "$it à¦¬à¦¾à¦° à¦¢à¦¾à¦•à¦¾ à¦¥à§‡à¦•à§‡ à¦•à¦•à§à¦¸à¦¬à¦¾à¦œà¦¾à¦° à¦¹à§‡à¦à¦Ÿà§‡ à¦¯à§‡à¦¤à§‡ à¦ªà¦¾à¦°à¦¤à§‡à¦¨" },
