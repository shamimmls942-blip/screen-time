          package com.example.screentime

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebView

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var wasGranted = false
              private var lastLoad = 0L

              inner class Bridge {
                  @JavascriptInterface
                  fun getScreenTime(): String = UsageReader.json(this@MainActivity)

                  @JavascriptInterface
                  fun share(text: String) {
                      runOnUiThread {
                          val i = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_TEXT, text)
                          }
                          startActivity(Intent.createChooser(i, null))
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Bridge(), "Android")
                  wasGranted = UsageReader.hasAccess(this)
                  web.loadUrl("file:///android_asset/index.html")
                  lastLoad = System.currentTimeMillis()

                  if (!wasGranted) {
                      AlertDialog.Builder(this)
                          .setTitle("à¦…à¦¨à§à¦®à¦¤à¦¿ à¦¦à¦°à¦•à¦¾à¦°")
                          .setMessage("à¦†à¦œà¦•à§‡à¦° à¦“ à¦—à¦¤ à§­ à¦¦à¦¿à¦¨à§‡à¦° à¦¸à§à¦•à§à¦°à¦¿à¦¨ à¦Ÿà¦¾à¦‡à¦® à¦¨à¦¿à¦œà§‡ à¦¥à§‡à¦•à§‡ à¦¦à§‡à¦–à¦¾à¦¤à§‡ \"Usage access\" à¦…à¦¨à§à¦®à¦¤à¦¿ à¦²à¦¾à¦—à¦¬à§‡à¥¤ à¦ªà¦°à§‡à¦° à¦¸à§à¦•à§à¦°à¦¿à¦¨à§‡ \"à¦¸à§à¦•à§à¦°à¦¿à¦¨ à¦Ÿà¦¾à¦‡à¦®\" à¦…à§à¦¯à¦¾à¦ª à¦¬à§‡à¦›à§‡ à¦šà¦¾à¦²à§ à¦•à¦°à§à¦¨à¥¤")
                          .setPositiveButton("à¦…à¦¨à§à¦®à¦¤à¦¿ à¦¦à¦¿à¦¨") { _, _ ->
                              startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                          }
                          .setNegativeButton("à¦ªà¦°à§‡", null)
                          .show()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val granted = UsageReader.hasAccess(this)
                  val stale = System.currentTimeMillis() - lastLoad > 60_000
                  if ((granted && !wasGranted) || (granted && stale)) {
                      web.reload()
                      lastLoad = System.currentTimeMillis()
                  }
                  wasGranted = granted
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
