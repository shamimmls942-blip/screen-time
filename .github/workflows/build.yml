name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ScreenTime"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.screentime"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.screentime"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.compose.material:material-icons-core")
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission
                  android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Screen Time"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/example/screentime
          cat > app/src/main/java/com/example/screentime/MainActivity.kt <<'EOF_5'
          package com.example.screentime

          import android.app.AppOpsManager
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.List
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Share
          import androidx.compose.material.icons.filled.Star
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import java.util.Calendar

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent { AppTheme { ScreenTimeApp() } }
              }
          }

          @Composable
          fun AppTheme(content: @Composable () -> Unit) {
              val dark = isSystemInDarkTheme()
              val ctx = LocalContext.current
              val scheme = if (Build.VERSION.SDK_INT >= 31) {
                  if (dark) dynamicDarkColorScheme(ctx) else dynamicLightColorScheme(ctx)
              } else {
                  if (dark) darkColorScheme() else lightColorScheme()
              }
              MaterialTheme(colorScheme = scheme, content = content)
          }

          // ---------- Data ----------

          data class AppUsage(val name: String, val millis: Long)
          data class Data(val apps: List<AppUsage>, val lifeTotal: Long, val lifeSince: Long, val avgDaily: Long)

          fun hasUsageAccess(ctx: Context): Boolean {
              val ops = ctx.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
              val mode = ops.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName)
              return mode == AppOpsManager.MODE_ALLOWED
          }

          fun dayStart(daysAgo: Int): Long = Calendar.getInstance().apply {
              add(Calendar.DAY_OF_YEAR, -daysAgo)
              set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0)
              set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
          }.timeInMillis

          fun usageTotal(ctx: Context, start: Long, end: Long): Long {
              val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
              val pm = ctx.packageManager
              return usm.queryAndAggregateUsageStats(start, end).values
                  .filter { pm.getLaunchIntentForPackage(it.packageName) != null }
                  .sumOf { it.totalTimeInForeground }
          }

          fun loadData(ctx: Context): Data {
              val now = System.currentTimeMillis()
              val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
              val pm = ctx.packageManager
              val stats = usm.queryUsageStats(UsageStatsManager.INTERVAL_YEARLY, 0, now)
                  .filter { it.totalTimeInForeground > 0 && pm.getLaunchIntentForPackage(it.packageName) != null }
              val apps = stats.groupBy { it.packageName }.map { (pkg, list) ->
                  val label = runCatching {
                      pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString()
                  }.getOrDefault(pkg)
                  AppUsage(label, list.sumOf { it.totalTimeInForeground })
              }.sortedByDescending { it.millis }
              val total = apps.sumOf { it.millis }
              val since = stats.minOfOrNull { it.firstTimeStamp } ?: now
              val daysSince = ((now - since) / 86_400_000L).coerceAtLeast(1L)

              val recent = (6 downTo 1).map { d -> usageTotal(ctx, dayStart(d), dayStart(d - 1)) }.filter { it > 0 }
              val avg = if (recent.isNotEmpty()) recent.average().toLong() else total / daysSince
              return Data(apps, total, since, avg)
          }

          fun f1(x: Double) = "%.1f".format(x)

          fun fmt(ms: Long): String {
              val m = ms / 60_000
              return if (m >= 60) "${m / 60} \u0998\u09a3\u09cd\u099f\u09be ${m % 60} \u09ae\u09bf\u09a8\u09bf\u099f" else "$m \u09ae\u09bf\u09a8\u09bf\u099f"
          }

          fun hoursFor(avgDailyMs: Long, years: Int): Double = avgDailyMs.toDouble() * 365.0 * years / 3_600_000.0

          // ---------- UI pieces ----------

          @Composable
          fun SectionTitle(t: String) {
              Text(t, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
          }

          @Composable
          fun InfoCard(title: String, body: String) {
              Card(
                  Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
              ) {
                  Column(Modifier.padding(16.dp)) {
                      Text(title, style = MaterialTheme.typography.titleSmall, color = MaterialTheme.colorScheme.primary)
                      Spacer(Modifier.height(4.dp))
                      Text(body, style = MaterialTheme.typography.bodyMedium)
                  }
              }
          }

          @Composable
          fun BigCard(label: String, big: String, sub: String, bg: Color, fg: Color) {
              Card(
                  Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(28.dp),
                  colors = CardDefaults.cardColors(containerColor = bg, contentColor = fg)
              ) {
                  Column(Modifier.padding(20.dp)) {
                      Text(label, style = MaterialTheme.typography.titleMedium)
                      Text(big, style = MaterialTheme.typography.displayMedium, fontWeight = FontWeight.Bold)
                      Text(sub, style = MaterialTheme.typography.bodyMedium)
                  }
              }
          }

          // ---------- Screens ----------

          @Composable
          fun ScreenTimeApp() {
              val ctx = LocalContext.current
              var granted by remember { mutableStateOf(hasUsageAccess(ctx)) }
              val owner = LocalLifecycleOwner.current
              DisposableEffect(owner) {
                  val obs = LifecycleEventObserver { _, e ->
                      if (e == Lifecycle.Event.ON_RESUME) granted = hasUsageAccess(ctx)
                  }
                  owner.lifecycle.addObserver(obs)
                  onDispose { owner.lifecycle.removeObserver(obs) }
              }
              if (granted) MainScreen() else PermissionScreen()
          }

          @Composable
          fun PermissionScreen() {
              val ctx = LocalContext.current
              Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text("\u09b8\u09cd\u0995\u09cd\u09b0\u09bf\u09a8 \u099f\u09be\u0987\u09ae", style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(12.dp))
                  Text(
                      "\u09ab\u09cb\u09a8\u09c7\u09b0 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u09a6\u09c7\u0996\u09a4\u09c7 'Usage access' \u0985\u09a8\u09c1\u09ae\u09a4\u09bf \u09a6\u09bf\u09a8\u0964 \u09a4\u09a5\u09cd\u09af \u09b6\u09c1\u09a7\u09c1 \u0986\u09aa\u09a8\u09be\u09b0 \u09ab\u09cb\u09a8\u09c7\u0987 \u09a5\u09be\u0995\u09c7\u0964",
                      textAlign = TextAlign.Center
                  )
                  Spacer(Modifier.height(20.dp))
                  Button(onClick = { ctx.startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)) }) {
                      Text("\u09b8\u09c7\u099f\u09bf\u0982\u09b8 \u0996\u09c1\u09b2\u09c1\u09a8")
                  }
              }
          }

          @Composable
          fun MainScreen() {
              val ctx = LocalContext.current
              var tab by remember { mutableStateOf(0) }
              var refresh by remember { mutableStateOf(0) }
              val data = remember(refresh) { loadData(ctx) }

              val onShare: (String) -> Unit = { text ->
                  val i = Intent(Intent.ACTION_SEND).apply {
                      type = "text/plain"
                      putExtra(Intent.EXTRA_TEXT, text)
                  }
                  ctx.startActivity(Intent.createChooser(i, null))
              }

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          NavigationBarItem(
                              selected = tab == 0, onClick = { tab = 0 },
                              icon = { Icon(Icons.Filled.Home, contentDescription = null) },
                              label = { Text("\u09b9\u09cb\u09ae") }
                          )
                          NavigationBarItem(
                              selected = tab == 1, onClick = { tab = 1 },
                              icon = { Icon(Icons.Filled.Star, contentDescription = null) },
                              label = { Text("\u09ae\u099c\u09be\u09b0 \u09b9\u09bf\u09b8\u09be\u09ac") }
                          )
                          NavigationBarItem(
                              selected = tab == 2, onClick = { tab = 2 },
                              icon = { Icon(Icons.Filled.List, contentDescription = null) },
                              label = { Text("\u0985\u09cd\u09af\u09be\u09aa\u09b8") }
                          )
                      }
                  }
              ) { pad ->
                  Box(Modifier.padding(pad)) {
                      when (tab) {
                          0 -> HomeTab(data, { refresh++ }, onShare)
                          1 -> FunTab(data)
                          else -> AppsTab(data)
                      }
                  }
              }
          }

          @Composable
          fun HomeTab(d: Data, onRefresh: () -> Unit, onShare: (String) -> Unit) {
              val h5 = hoursFor(d.avgDaily, 5)
              val h4 = hoursFor(d.avgDaily, 4)
              val days5 = h5 / 24
              val days4 = h4 / 24
              val crore5 = h5 * 2000 / 1.0e7
              val crore4 = h4 * 2000 / 1.0e7
              val shareText = "\u0986\u09ae\u09bf \u09eb \u09ac\u099b\u09b0\u09c7 \u09ab\u09cb\u09a8\u09c7\u09b0 \u09aa\u09c7\u099b\u09a8\u09c7 \u09aa\u09cd\u09b0\u09be\u09af\u09bc ${days5.toInt()} \u09a6\u09bf\u09a8 \u09a6\u09bf\u09af\u09bc\u09c7\u099b\u09bf! \u0993\u0987 \u09b8\u09ae\u09af\u09bc \u0997\u09b0\u09c1\u09b0 \u0996\u09be\u09ae\u09be\u09b0 \u09a6\u09bf\u09b2\u09c7 \u0995\u09cb\u099f\u09bf\u09aa\u09a4\u09bf \u09b9\u09a4\u09be\u09ae!"

              LazyColumn(
                  Modifier.fillMaxSize().padding(horizontal = 16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  item {
                      Row(
                          Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              "\u09ab\u09cb\u09a8\u09c7\u09b0 \u09aa\u09c7\u099b\u09a8\u09c7 \u0995\u09a4 \u09b8\u09ae\u09af\u09bc?",
                              style = MaterialTheme.typography.headlineSmall,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier.weight(1f)
                          )
                          IconButton(onClick = onRefresh) { Icon(Icons.Filled.Refresh, contentDescription = "\u09b0\u09bf\u09ab\u09cd\u09b0\u09c7\u09b6") }
                      }
                  }
                  item {
                      BigCard(
                          "\u09eb \u09ac\u099b\u09b0\u09c7", "${days5.toInt()} \u09a6\u09bf\u09a8",
                          "\u2248 ${f1(days5 / 30)} \u09ae\u09be\u09b8 \u09a6\u09bf\u09a8\u09b0\u09be\u09a4 \u098f\u0995\u099f\u09be\u09a8\u09be \u09ab\u09cb\u09a8\u09c7!",
                          MaterialTheme.colorScheme.primaryContainer, MaterialTheme.colorScheme.onPrimaryContainer
                      )
                  }
                  item {
                      BigCard(
                          "\u09ea \u09ac\u099b\u09b0\u09c7", "${days4.toInt()} \u09a6\u09bf\u09a8",
                          "\u2248 ${f1(days4 / 30)} \u09ae\u09be\u09b8 \u09a6\u09bf\u09a8\u09b0\u09be\u09a4 \u098f\u0995\u099f\u09be\u09a8\u09be \u09ab\u09cb\u09a8\u09c7!",
                          MaterialTheme.colorScheme.secondaryContainer, MaterialTheme.colorScheme.onSecondaryContainer
                      )
                  }
                  item {
                      BigCard(
                          "\u0997\u09b0\u09c1\u09b0 \u0996\u09be\u09ae\u09be\u09b0 \u09a6\u09bf\u09b2\u09c7 \u0995\u09cb\u099f\u09bf\u09aa\u09a4\u09bf \u09b9\u09a4\u09c7\u09a8!",
                          "${f1(crore5)} \u0995\u09cb\u099f\u09bf",
                          "\u09eb \u09ac\u099b\u09b0\u09c7 ${f1(crore5)} \u0995\u09cb\u099f\u09bf, \u09ea \u09ac\u099b\u09b0\u09c7 ${f1(crore4)} \u0995\u09cb\u099f\u09bf \u099f\u09be\u0995\u09be (\u0998\u09a3\u09cd\u099f\u09be\u09af\u09bc \u0997\u09a1\u09bc\u09c7 \u09ae\u09be\u09a4\u09cd\u09b0 \u09e8,\u09e6\u09e6\u09e6 \u099f\u09be\u0995\u09be \u09b2\u09be\u09ad \u09a7\u09b0\u09c7)\u0964 ${(h5 / 50).toInt()} \u099f\u09be \u0997\u09b0\u09c1\u09b0 \u09ae\u09be\u09b2\u09bf\u0995 \u09b9\u09a4\u09c7\u09a8, \u09aa\u09be\u09a1\u09bc\u09be\u09af\u09bc \u09b8\u09ac\u09be\u0987 '\u0996\u09be\u09ae\u09be\u09b0\u09bf \u09ad\u09be\u0987' \u09a1\u09be\u0995\u09a4!",
                          MaterialTheme.colorScheme.tertiaryContainer, MaterialTheme.colorScheme.onTertiaryContainer
                      )
                  }
                  item { InfoCard("\u09b9\u09bf\u09b8\u09be\u09ac\u099f\u09be \u0995\u09c0\u09ad\u09be\u09ac\u09c7", "\u0986\u09aa\u09a8\u09be\u09b0 \u09b8\u09be\u09ae\u09cd\u09aa\u09cd\u09b0\u09a4\u09bf\u0995 \u09a6\u09c8\u09a8\u09bf\u0995 \u0997\u09a1\u09bc \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u09a6\u09bf\u09af\u09bc\u09c7 \u09ea \u0993 \u09eb \u09ac\u099b\u09b0\u09c7\u09b0 \u0986\u09a8\u09c1\u09ae\u09be\u09a8\u09bf\u0995 \u09b9\u09bf\u09b8\u09be\u09ac \u0995\u09b0\u09be \u09b9\u09af\u09bc\u09c7\u099b\u09c7\u0964 \u098f\u0995\u099f\u09c1 \u09ad\u09c1\u09b2 \u09b9\u09a4\u09c7\u0987 \u09aa\u09be\u09b0\u09c7\u0964") }
                  item {
                      Button(onClick = { o
