                      addView(tv("${num(h)} à¦˜à¦£à§à¦Ÿà¦¾", 40f, Color.WHITE, true))
                      addView(tv("à¦…à¦°à§à¦¥à¦¾à§Ž", 16f, 0xFFEDE7FF.toInt(), false))
                      addView(tv("${num(days5y.toLong())} à¦¦à¦¿à¦¨", 40f, Color.WHITE, true))
