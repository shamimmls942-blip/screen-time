                  val picks = acts.filter { (hours5y / it.per).toLong() >= 1 }.shuffled(Random(seed)).take(3)
                  val lines = if (picks.isEmpty()) listOf("ðŸ‘ à¦†à¦ªà¦¨à¦¾à¦° à¦«à§‹à¦¨ à¦¬à§à¦¯à¦¬à¦¹à¦¾à¦° à¦–à§à¦¬à¦‡ à¦•à¦® â€” à¦šà¦¾à¦²à¦¿à¦¯à¦¼à§‡ à¦¯à¦¾à¦¨!")
                  else picks.map { "${it.emoji} ${it.text(num((hours5y / it.per).toLong()))}" }
                  root.addView(card(0xFF673C48.toInt()).apply {
                      addView(tv("ðŸ˜‚ ${num(h)} à¦˜à¦£à§à¦Ÿà¦¾à¦¯à¦¼ à¦†à¦ªà¦¨à¦¿ à¦¯à¦¾ à¦•à¦°à¦¤à§‡ à¦ªà¦¾à¦°à¦¤à§‡à¦¨ â€”", 17f, Color.WHITE, true))
                      lines.forEach { addView(tv(it, 17f, Color.WHITE, false).apply { setPadding(0, dp(10), 0, 0) }) }
                  })
                  // à¦¶à§‡à¦¯à¦¼à¦¾à¦°
                  val shareText = "à¦†à¦®à¦¿ à§« à¦¬à¦›à¦°à§‡ à¦«à§‹à¦¨à§‡ à¦¬à§à¦¯à¦¯à¦¼ à¦•à¦°à¦¬ ${num(h)} à¦˜à¦£à§à¦Ÿà¦¾ (${num(days5y.toLong())} à¦¦à¦¿à¦¨)! " +
                      "à¦†à¦œ: ${dur(today)}, à¦—à¦¤ à§­ à¦¦à¦¿à¦¨: ${dur(week)} ðŸ“±"
                  root.addView(button("à¦¬à¦¨à§à¦§à§à¦¦à§‡à¦° à¦¸à¦¾à¦¥à§‡ à¦¶à§‡à¦¯à¦¼à¦¾à¦° à¦•à¦°à§à¦¨") {
