          package com.example.screentime

          import android.app.AppOpsManager
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Calendar

          object UsageReader {

              fun hasAccess(ctx: Context): Boolean {
                  val ops = ctx.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = ops.checkOpNoThrow(
                      AppOpsManager.OPSTR_GET_USAGE_STATS,
                      android.os.Process.myUid(),
                      ctx.packageName
                  )
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun dayStart(daysAgo: Int): Long {
                  val c = Calendar.getInstance()
                  c.add(Calendar.DAY_OF_YEAR, -daysAgo)
                  c.set(Calendar.HOUR_OF_DAY, 0)
                  c.set(Calendar.MINUTE, 0)
                  c.set(Calendar.SECOND, 0)
                  c.set(Calendar.MILLISECOND, 0)
                  return c.timeInMillis
              }

              private fun minutes(usm: UsageStatsManager, from: Long, to: Long): Long =
                  usm.queryAndAggregateUsageStats(from, to).values
                      .sumOf { it.totalTimeInForeground } / 60000

              /** {"today":à¦®à¦¿à¦¨à¦¿à¦Ÿ,"days":[à§­à¦Ÿà¦¾ à¦®à¦¿à¦¨à¦¿à¦Ÿ, à¦ªà§à¦°à¦¨à§‹ â†’ à¦—à¦¤à¦•à¦¾à¦²]} â€” à¦…à¦¨à§à¦®à¦¤à¦¿ à¦¨à¦¾ à¦¥à¦¾à¦•à¦²à§‡ "{}" */
              fun json(ctx: Context): String {
                  if (!hasAccess(ctx)) return "{}"
                  val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val days = JSONArray()
                  for (i in 7 downTo 1) days.put(minutes(usm, dayStart(i), dayStart(i - 1)))
                  return JSONObject()
                      .put("today", minutes(usm, dayStart(0), System.currentTimeMillis()))
                      .put("days", days)
                      .toString()
              }
          }
